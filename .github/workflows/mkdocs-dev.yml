# Reusable: publish the caller's docs as the `dev` version with mike (pushes to gh-pages).
# Caller must grant `permissions: contents: write`.
name: mkdocs dev
on:
  workflow_call:
    inputs:
      python-version: { type: string, default: "3.11" }
jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with: { python-version: "${{ inputs.python-version }}", cache: pip, cache-dependency-path: requirements-docs.txt }
      - run: pip install -r requirements-docs.txt
      - name: mike deploy dev
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then git checkout gh-pages && git pull -q origin gh-pages && git checkout -; fi
          mike deploy --push --update-aliases dev
          if ! mike list | grep -q latest; then mike set-default --push dev; fi
          rm -rf site
